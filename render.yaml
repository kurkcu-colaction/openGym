services:
  - type: web
    name: opengym
    runtime: docker
    dockerfilePath: ./render/Dockerfile.render
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: FIRST_USER_ADMIN
        value: "1"
      - key: DEFAULT_LANG
        value: tr